topic: os.memory-management
version: "2026.10.1"
concepts:
  - slug: os.address-translation
    name: Logical and physical addresses
    aliases: [logical address, physical address, virtual address, address binding, MMU, memory management unit]
    difficulty: 2
    further_reading: [silberschatz-os, ostep]
    definition: >-
      Programs use logical (virtual) addresses. The memory management unit
      (MMU) translates each logical address into a physical address in RAM at
      run time, which lets the OS place and move processes freely and keep
      them isolated.
    attributes:
      logical_address: generated by the CPU for the running program
      physical_address: the location actually sent to memory
      translator: memory management unit (MMU)
      simplest_scheme: base and limit registers
    documents:
      - kind: explanation
        title: Base and limit registers
        depth: 1
        body: |-
          In the simplest scheme the MMU holds a base (relocation) register and
          a limit register for the running process. A logical address a is
          valid if a < limit, and maps to physical address base + a. An
          address at or above the limit traps to the OS, which is how one
          process is prevented from reading another's memory.
    questions:
      - slug: q.os.memory-management.1
        kind: multiple_choice
        style: application
        difficulty: 2
        prompt: >-
          A process has base register 30000 and limit register 12000. Which
          physical address does logical address 2500 map to?
        options: ["2500", "12000", "32500", "42000"]
        answer: {option_index: 2}
        explanation: 2500 < 12000, so it is valid and maps to 30000 + 2500 = 32500.

  - slug: os.fragmentation
    name: Fragmentation
    aliases: [external fragmentation, internal fragmentation, compaction, first fit, best fit, worst fit]
    difficulty: 2
    further_reading: [silberschatz-os]
    definition: >-
      External fragmentation is free memory split into holes too small to use
      even though their total would be enough. Internal fragmentation is
      memory wasted inside an allocated block that is larger than requested.
    attributes:
      external: free space scattered between allocated regions; caused by variable-size allocation
      internal: unused space inside an allocated unit; caused by fixed-size units such as pages
      fixes_external: compaction, or paging
      placement_strategies: first fit, best fit, worst fit
    requires: [os.address-translation]
    documents:
      - kind: explanation
        title: External versus internal
        depth: 1
        body: |-
          With variable-size contiguous allocation, processes come and go and
          leave holes. You might have 40 KB free in total but no single hole
          of 20 KB: that is external fragmentation.

          Paging removes external fragmentation, because any free frame can
          hold any page, but the last page of a process is usually partly
          empty. With 4 KB pages, a 9 KB process needs 3 pages (12 KB) and
          wastes 3 KB: that is internal fragmentation.
    questions:
      - slug: q.os.memory-management.2
        kind: multiple_choice
        difficulty: 2
        prompt: Paging eliminates which kind of fragmentation?
        options: [Internal, External, Both, Neither]
        answer: {option_index: 1}
        explanation: Any free frame can hold any page, so scattered free frames are still usable. The last page can still be partly empty.
      - slug: q.os.memory-management.3
        kind: multiple_choice
        style: application
        difficulty: 2
        prompt: With 4 KB pages, how much internal fragmentation does a 10 KB process cause?
        options: [0 KB, 1 KB, 2 KB, 4 KB]
        answer: {option_index: 2}
        explanation: It needs 3 pages (12 KB) for 10 KB of data, wasting 2 KB.

  - slug: os.paging
    name: Paging
    aliases: [page table, pages and frames, page number and offset, page frame]
    difficulty: 3
    further_reading: [silberschatz-os, ostep]
    definition: >-
      Paging divides logical memory into fixed-size pages and physical memory
      into frames of the same size. A page table maps each page number to a
      frame number; a logical address is split into a page number and an
      offset within the page.
    attributes:
      page_number: logical address div page size (the high bits)
      offset: logical address mod page size (the low bits)
      physical_address: frame number × page size + offset
      offset_bits: log2(page size)
    requires: [os.address-translation]
    related: [os.tlb, os.virtual-memory-concept]
    documents:
      - kind: procedure
        title: Translating an address with paging
        depth: 2
        body: Turn a logical address into a physical address.
        steps:
          - Divide the logical address by the page size; the quotient is the page number p and the remainder is the offset d.
          - Look up p in the page table to get frame number f.
          - The physical address is f × page size + d.
      - kind: example
        title: Paging with 4 KB pages
        depth: 2
        body: |-
          Page size 4096 bytes, logical address 13000.
          13000 div 4096 = 3, remainder 13000 − 12288 = 712. So p = 3, d = 712.
          If the page table maps page 3 to frame 7, the physical address is
          7 × 4096 + 712 = 28672 + 712 = 29384.
          With 32-bit addresses and 4 KB pages, the offset uses 12 bits and the
          page number 20 bits, so there are 2^20 pages.
    questions:
      - slug: q.os.memory-management.4
        kind: multiple_choice
        style: application
        difficulty: 3
        prompt: >-
          Page size is 1024 bytes and page 2 is in frame 5. What physical
          address does logical address 2100 map to?
        options: ["2100", "5172", "6196", "7220"]
        answer: {option_index: 1}
        explanation: 2100 = 2 × 1024 + 52, so p = 2, d = 52, and the physical address is 5 × 1024 + 52 = 5172.
      - slug: q.os.memory-management.5
        kind: multiple_choice
        difficulty: 3
        prompt: With 32-bit logical addresses and 4 KB pages, how many bits form the offset?
        options: ["4", "10", "12", "20"]
        answer: {option_index: 2}
        explanation: 4 KB = 2^12 bytes, so 12 bits address a byte within a page.

  - slug: os.tlb
    name: Translation lookaside buffer
    aliases: [TLB, translation look-aside buffer, effective access time, EAT, TLB hit ratio]
    difficulty: 3
    further_reading: [silberschatz-os, ostep]
    definition: >-
      A translation lookaside buffer is a small, fast cache of recent
      page-to-frame translations. A TLB hit avoids reading the page table in
      memory, so a high hit ratio keeps paging fast.
    attributes:
      on_hit: one memory access for the data
      on_miss: an extra memory access to read the page table, then the TLB is updated
      effective_access_time: hit ratio × hit time + (1 − hit ratio) × miss time
    requires: [os.paging]
    documents:
      - kind: example
        title: Effective access time
        depth: 2
        body: |-
          TLB lookup 20 ns, memory access 100 ns, hit ratio 80%, single-level
          page table.
          Hit: 20 + 100 = 120 ns. Miss: 20 + 100 (page table) + 100 (data)
          = 220 ns.
          EAT = 0.8 × 120 + 0.2 × 220 = 96 + 44 = 140 ns.
    questions:
      - slug: q.os.memory-management.6
        kind: multiple_choice
        style: application
        difficulty: 3
        prompt: >-
          TLB lookup takes 10 ns, a memory access takes 100 ns, and the hit
          ratio is 90% with a single-level page table. What is the effective
          memory access time?
        options: [100 ns, 110 ns, 120 ns, 210 ns]
        answer: {option_index: 2}
        explanation: 0.9 × (10 + 100) + 0.1 × (10 + 200) = 99 + 21 = 120 ns.

  - slug: os.segmentation
    name: Segmentation
    aliases: [segment table, segments, segmented memory]
    difficulty: 3
    further_reading: [silberschatz-os]
    definition: >-
      Segmentation divides a program's address space into variable-size
      logical units such as code, data and stack. An address is a (segment,
      offset) pair, translated through a segment table of base and limit
      values.
    attributes:
      unit: variable-size segments that match the program's structure
      address: (segment number, offset)
      fragmentation: external
    requires: [os.address-translation]
    contrasts: [os.paging]
    documents:
      - kind: explanation
        title: Segmentation versus paging
        depth: 2
        body: |-
          Segments follow the program's logical structure, so protection and
          sharing (for example a read-only code segment) are natural. Because
          segments vary in size, they suffer external fragmentation. Pages are
          all the same size, which avoids external fragmentation but has no
          link to program structure. Many systems combine the two.
    questions:
      - slug: q.os.memory-management.7
        kind: multiple_choice
        difficulty: 3
        prompt: >-
          Segment 2 has base 4300 and limit 400. What happens on an access to
          (segment 2, offset 500)?
        options: [It maps to 4800, It maps to 4700, It traps as an addressing error, It maps to 500]
        answer: {option_index: 2}
        explanation: The offset 500 is not less than the limit 400, so the access is illegal.
